<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1b4661" />
    <meta name="description" content="AgriVision onion quality inspection and batch reports." />
    <title>AgriVision · Onion quality studio</title>
    <link rel="icon" href="/static/assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#overview" aria-label="AgriVision overview">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 44 44" fill="none">
              <path d="M22 7c-2.8 4.1-9.5 7-12.1 13.1-3.4 8.2 2.1 16.8 12.1 16.8s15.5-8.6 12.1-16.8C31.5 14 24.8 11.1 22 7Z" fill="#E8BD63" />
              <path d="M22 8.5c1.4 5.2 1.3 8.4 0 10.8-1.3-2.4-1.4-5.6 0-10.8Z" fill="#1B4661" />
              <path d="M21.8 19.1c-1.7 5.7-2.1 11.5.1 17.6M17.8 22.2c1.3 3 2.1 6.9 2.1 10.5M26.2 22.2c-1.3 3-2.1 6.9-2.1 10.5" stroke="#A47B32" stroke-width="1.25" stroke-linecap="round" />
            </svg>
          </span>
          <span class="brand-copy"><strong>AgriVision</strong><small>QUALITY STUDIO</small></span>
        </a>

        <div class="sidebar-label">WORKSPACE</div>
        <nav class="nav-group" aria-label="Workspace">
          <a class="nav-link active" href="#overview" data-route="overview">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
            <span>Overview</span>
          </a>
          <a class="nav-link" href="#inspect" data-route="inspect">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/><rect x="3.5" y="3.5" width="17" height="17" rx="5"/></svg>
            <span>New inspection</span><span class="nav-shortcut">⌘ I</span>
          </a>
        </nav>

        <div class="sidebar-label sidebar-label-spaced">RECORDS</div>
        <nav class="nav-group" aria-label="Records">
          <a class="nav-link" href="#reports" data-route="reports">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.75h7l4 4v12.5H7a2 2 0 0 1-2-2V5.75a2 2 0 0 1 2-2Z"/><path d="M14 4v4h4M8.5 12h7M8.5 15.5h7"/></svg>
            <span>Inspection reports</span>
          </a>
          <a class="nav-link" href="#guide" data-route="guide">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s7.5-3.8 7.5-10.1A4.1 4.1 0 0 0 12 8.2a4.1 4.1 0 0 0-7.5 2.2C4.5 16.7 12 20.5 12 20.5Z"/><path d="M12 8v8m0-4c-1.7-.1-3-.7-3.7-1.7M12 14c1.6-.2 2.7-.9 3.5-2"/></svg>
            <span>Grading guide</span>
          </a>
        </nav>

        <div class="sidebar-bottom">
          <div class="sidebar-note-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5v17M4.7 7.3l14.6 9.4M4.7 16.7l14.6-9.4"/><circle cx="12" cy="12" r="8.5"/></svg></div>
          <div><strong>Built for clear calls</strong><span>Evidence beside every grade.</span></div>
          <span class="tiny-leaf" aria-hidden="true">✳</span>
        </div>
        <div class="profile-row">
          <div class="avatar">IB</div><div class="profile-copy"><strong>IndieBuild team</strong><span>Local demo workspace</span></div>
          <button class="icon-button profile-more" aria-label="Workspace menu"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
        </div>
      </aside>

      <main class="main-shell">
        <header class="topbar">
          <button class="icon-button mobile-menu" id="mobileMenu" aria-label="Open navigation"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
          <div class="breadcrumbs"><span>AgriVision</span><span class="crumb-divider">/</span><strong id="crumbCurrent">Overview</strong></div>
          <div class="topbar-right">
            <span class="local-indicator"><i></i><span id="modelStatusLabel">Local workspace</span></span>
            <button class="top-avatar" title="IndieBuild team">IB</button>
          </div>
        </header>

        <div class="page-content" id="pageContent" tabindex="-1"></div>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="/static/app.js" defer></script>
  </body>
</html>
